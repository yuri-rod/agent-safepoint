[package]
name = "safepoint"
version = "0.1.0"
edition = "2021"
description = "Universal, local-first undo and recovery layer for coding agents"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
ignore = "0.4"
similar = { version = "2.6", features = ["inline"] }
colored = "2.1"
tempfile = "3.10"

[dev-dependencies]
tempfile = "3.10"
